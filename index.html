<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content='30" Vert'><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>30" Vertical Tracker</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0;padding-bottom:80px}header{background:#111827;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;position:sticky;top:0;z-index:10}h1{font-size:22px;margin:0 0 4px}.sub{font-size:13px;color:#cbd5e1}main{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 1px 4px #0001}.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}.tab{border:0;background:#fff;padding:10px 14px;border-radius:12px;font-weight:800;white-space:nowrap}.tab.active{background:#111827;color:#fff}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{font-size:12px;background:#e5e7eb;padding:5px 9px;border-radius:20px}.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;background:#111827;width:0}.day{font-size:18px;margin:0}.exercise{border-top:1px solid #e5e7eb;padding:14px 0}.exercise:first-child{border-top:0}.name{font-weight:800}.detail{font-size:13px;color:#6b7280;margin:4px 0 10px}.row{display:flex;gap:8px}.row input{flex:1;min-width:0;border:1px solid #d1d5db;border-radius:10px;padding:10px;font-size:16px}.done{border:0;border-radius:10px;padding:10px 12px;font-weight:800;background:#e5e7eb;white-space:nowrap}.done.yes{background:#111827;color:#fff}.primary{border:0;border-radius:10px;background:#111827;color:#fff;padding:10px 14px;font-weight:800}.danger{border:1px solid #fecaca;background:#fff;color:#b91c1c;border-radius:10px;padding:10px 14px}.small{font-size:12px;color:#6b7280}.jumpinput{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:11px;font-size:16px;margin-top:8px}footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;just <header><h1>30" Vertical Tracker</h1><div class="sub">12-week program · 15" baseline · 30" goal</div></header><main><section class="card"><div class="topline"><strong>Week progress</strong><span id="pct" class="pill">0%</span></div><div class="progress"><div id="bar" class="bar"></div></div></section><div id="weeks" class="tabs"></div><div id="content"></div><section class="card"><div class="topline"><strong>Best vertical — Week <span id="jumpWeek"></span></strong><span class="small">inches</span></div><input id="jump" class="jumpinput" type="number" min="0" step="0.1" placeholder="e.g. 18.5"><button class="primary" style="margin-top:9px" onclick="saveJump()">Save weekly jump</button></section><section class="card"><strong>Data</strong><div class="small" style="margin:5px 0 10px">Tracking stays in this browser. Export a backup before changing phones.</div><div class="row"><button class="primary" onclick="exportData()">Export backup</button><button class="danger" onclick="resetAll()">Reset all</button></div><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(event)"><button class="done" style="margin-top:9px;width:100%" onclick="document.getElementById('importFile').click()">Import backup</button></section></main><footer><span class="small">Auto-saves</span><span id="weekLabel" class="small"></span></footer>
<script>
const plan={};function add(w,d,items){(plan[w]??={})[d]=items}const a=(x)=>x+" lb",sq=[180,185,190,175],rdl=[140,145,150,135],bulg=[25,30,30,25],calf=[120,125,130,115],satSq=[195,200,205,185],trap=[185,195,205,175];for(let i=0;i<4;i++){let w=i+1;add(w,"Mon",[["Countermovement jump","5 × 2","Bodyweight"],["Back squat","4 × 5",a(sq[i])],["Romanian deadlift","3 × 6",a(rdl[i])],["Bulgarian split squat","2 × 6/leg",bulg[i]+" lb DB/hand"],["Seated calf raise","3 × 8",a(calf[i])]]);add(w,"Wed",[["Box jump","4 × 2","Bodyweight"],["Trap-bar jump","5 × 3","50–60 lb"],["Broad jump","4 × 2","Bodyweight"],["Pogo jump","3 × 10","Bodyweight"]]);add(w,"Sat",[["Max vertical jump","5 × 1","Bodyweight"],["Back squat","4 × 3",a(satSq[i])],["Trap-bar deadlift","3 × 4",a(trap[i])],["Reverse lunge","2 × 6/leg","Light/moderate"],["Seated calf raise","3 × 8",a(calf[i])]])}const sq2=[200,205,210,185],rdl2=[150,155,160,140],bulg2=[30,30,35,25],calf2=[130,135,140,120],satSq2=[210,215,220,185],trap2=[200,210,220,185];for(let i=0;i<4;i++){let w=i+5;add(w,"Mon",[["Max vertical jump","5 × 2","Bodyweight"],["Back squat","4 × 3",a(sq2[i])],["Romanian deadlift","3 × 5",a(rdl2[i])],["Bulgarian split squat","2 × 6/leg",bulg2[i]+" lb DB/hand"],["Seated calf raise","3 × 8",a(calf2[i])]]);add(w,"Wed",[["Box jump","4 × 2","Bodyweight"],["Trap-bar jump","5 × 3","60–75 lb"],["Broad jump","4 × 2","Bodyweight"],["Pogo jump","3 × 12","Bodyweight"]]);add(w,"Sat",[["Max vertical jump","6 × 1","Bodyweight"],["Approach jump","4 × 1","Bodyweight"],["Back squat","4 × 2",a(satSq2[i])],["Trap-bar deadlift","3 × 3",a(trap2[i])],["Reverse lunge","2 × 5/leg","Light/moderate"]])}for(let w=9;w<=11;w++){let i=w-9;add(w,"Mon",[["Max vertical jump","6 × 1","Bodyweight"],["Back squat","3 × 2",a([200,205,210][i])],["Trap-bar jump","4 × 2","60–75 lb"],["Romanian deadlift","3 × 5",a([145,150,155][i])],["Bulgarian split squat","2 × 5/leg",[25,30,30][i]+" lb DB/hand"]]);add(w,"Wed",[["Countermovement jump","4 × 2","Bodyweight"],["Low depth jump","3 × 2","Low box"],["Broad jump","3 × 2","Bodyweight"],["Pogo jump","3 × 10","Bodyweight"]]);add(w,"Sat",[["Max vertical jump","6 × 1","Bodyweight"],["Approach jump","5 × 1","Bodyweight"],["Trap-bar deadlift","2 × 3",a([195,205,215][i])],["Back squat","3 × 2",a([200,205,210][i])],["Light split squat","2 × 5/leg",[25,30,30][i]+" lb DB/hand"]])}add(12,"Mon",[["Max jump","4 × 1","Bodyweight"],["Back squat","3 × 2","170 lb"],["Romanian deadlift","2 × 5","125 lb"],["Trap-bar jump","3 × 2","50–60 lb"],["Seated calf raise","2 × 8","100–110 lb"]]);add(12,"Wed",[["Max jump","4 × 1","Bodyweight"],["Pogo jump","2 × 10","Bodyweight"],["Mobility","10–15 min","Easy"]]);add(12,"Sat",[["VERTICAL TEST","9 max attempts","Bodyweight"]]);
let week=Number(localStorage.getItem("vjWeek")||1),data=JSON.parse(localStorage.getItem("vjData")||"{}");const k=(w,d,i)=>`w${w}-${d}-${i}`,save=()=>localStorage.setItem("vjData",JSON.stringify(data));function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}function render(){document.querySelectorAll(".tab").forEach((b,i)=>b.classList.toggle("active",i+1===week));let total=0,done=0,html="";for(const[d,items]of Object.entries(plan[week])){let dd=items.filter((_,i)=>data[k(week,d,i)]?.done).length;html+=`<section class="card"><div class="topline"><h2 class="day">${d==="Mon"?"Monday":d==="Wed"?"Wednesday":"Saturday"}</h2><span class="pill">${dd}/${items.length} done</span></div>`;items.forEach((e,i)=>{total++;let v=data[k(week,d,i)]||{};if(v.done)done++;html+=`<div class="exercise"><div class="name">${e[0]}</div><div class="detail">${e[1]} · Target: ${e[2]}</div><div class="row"><input placeholder="Actual load / result" value="${esc(v.actual||"")}" onchange="setActual('${k(week,d,i)}',this.value)"><button class="done ${v.done?"yes":""}" onclick="toggle('${k(week,d,i)}')">${v.done?"✓ Done":"Mark done"}</button></div></div>`});html+="</section>"}document.getElementById("content").innerHTML=html;let p=total?Math.round(done/total*100):0;document.getElementById("bar").style.width=p+"%";document.getElementById("pct").textContent=p+"%";document.getElementById("jumpWeek").textContent=week;document.getElementById("jump").value=data["jump-"+week]||"";document.getElementById("weekLabel").textContent=`Week ${week} of 12`}function toggle(id){data[id]=data[id]||{};data[id].done=!data[id].done;save();render()}function setActual(id,v){data[id]=data[id]||{};data[id].actual=v;save()}function saveJump(){data["jump-"+week]=document.getElementById("jump").value;save();alert("Weekly jump saved.")}function exportData(){let blob=new Blob([JSON.stringify({version:1,data},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="30inch-vertical-backup.json";a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);data=x.data||x;save();render();alert("Backup imported.")}catch{alert("Backup could not be read.")}};r.readAsText(f)}function resetAll(){if(confirm("Reset all tracking data?")){data={};save();render()}}document.getElementById("weeks").innerHTML=Array.from({length:12},(_,i)=>`<button class="tab" onclick="week=${i+1};localStorage.setItem('vjWeek',week);render()">Week ${i+1}</button>`).join("");render();
